<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378 362" role="img" aria-labelledby="title desc">
  <title id="title">Applix logo mark</title>
  <desc id="desc">A stylized letter A built from dark and light teal rounded geometric panels with an orange check mark and white spacing.</desc>
  <defs>
    <linearGradient id="darkTeal" x1="39" y1="313" x2="253" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#155b58"/>
      <stop offset="1" stop-color="#0e4b4c"/>
    </linearGradient>
    <linearGradient id="lightTeal" x1="221" y1="313" x2="310" y2="151" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55a39c"/>
      <stop offset="1" stop-color="#34827e"/>
    </linearGradient>
    <linearGradient id="orange" x1="79" y1="260" x2="276" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f47721"/>
      <stop offset="1" stop-color="#e9601f"/>
    </linearGradient>
  </defs>

  <!-- Upper-left and crossbar section -->
  <path fill="url(#darkTeal)" d="
    M64 185
    L108 72
    C115 54 130 42 149 42
    H216
    C237 42 253 57 258 78
    L267 119
    C250 119 240 124 229 137
    L145 230
    C141 235 134 235 130 230
    L100 199
    C89 188 76 181 64 185
    Z"/>

  <!-- Lower-left leg -->
  <path fill="url(#darkTeal)" d="
    M50 313
    C35 313 26 299 31 286
    L64 185
    C78 181 91 188 101 199
    L132 296
    C136 307 126 313 111 313
    Z"/>

  <!-- Right leg -->
  <path fill="url(#lightTeal)" d="
    M250 313
    C237 313 226 305 222 293
    L203 235
    L271 157
    C280 147 293 150 298 162
    L337 286
    C342 301 332 313 316 313
    Z"/>

  <!-- White separation around the check -->
  <path d="M78 197 L139 260 L273 108" fill="none" stroke="#fbfaf7" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orange check -->
  <path d="M80 200 L140 260 L274 108" fill="none" stroke="url(#orange)" stroke-width="28" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
