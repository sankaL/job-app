services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_APP_ENV: ${APP_ENV:-development}
      VITE_APP_DEV_MODE: ${APP_DEV_MODE:-true}
      VITE_API_URL: ${API_URL:-http://localhost:54800}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEV_MODE: ${APP_DEV_MODE:-true}
      API_PORT: "8000"
      APP_URL: ${APP_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${APP_URL:-http://localhost:5173}
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      INVITE_LINK_EXPIRY_HOURS: ${INVITE_LINK_EXPIRY_HOURS:-168}
      WORKER_CALLBACK_SECRET: ${WORKER_CALLBACK_SECRET}
      DUPLICATE_SIMILARITY_THRESHOLD: ${DUPLICATE_SIMILARITY_THRESHOLD:-85}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${BACKEND_HOST_PORT:-54800}:8000"
    volumes:
      - ./backend:/app
      - ./shared:/workspace/shared:ro
    depends_on:
      migration-runner:
        condition: service_completed_successfully
      redis:
        condition: service_started

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEV_MODE: ${APP_DEV_MODE:-true}
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_CALLBACK_SECRET: ${WORKER_CALLBACK_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EXTRACTION_AGENT_MODEL: ${EXTRACTION_AGENT_MODEL:-}
      EXTRACTION_AGENT_FALLBACK_MODEL: ${EXTRACTION_AGENT_FALLBACK_MODEL:-}
      GENERATION_AGENT_MODEL: ${GENERATION_AGENT_MODEL:-}
      GENERATION_AGENT_FALLBACK_MODEL: ${GENERATION_AGENT_FALLBACK_MODEL:-}
      GENERATION_AGENT_REASONING_EFFORT: ${GENERATION_AGENT_REASONING_EFFORT:-none}
      VALIDATION_AGENT_MODEL: ${VALIDATION_AGENT_MODEL:-}
      VALIDATION_AGENT_FALLBACK_MODEL: ${VALIDATION_AGENT_FALLBACK_MODEL:-}
      RESUME_JUDGE_AGENT_MODEL: ${RESUME_JUDGE_AGENT_MODEL:-openai/gpt-5.4-mini}
      RESUME_JUDGE_AGENT_FALLBACK_MODEL: ${RESUME_JUDGE_AGENT_FALLBACK_MODEL:-openai/gpt-5-mini}
      RESUME_JUDGE_AGENT_REASONING_EFFORT: ${RESUME_JUDGE_AGENT_REASONING_EFFORT:-none}
    volumes:
      - ./agents:/app
      - ./shared:/workspace/shared:ro
    ipc: host
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migration-runner:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/workspace/scripts/run_migrations.sh"]
    volumes:
      - ./supabase/migrations:/workspace/migrations:ro
      - ./scripts/run_migrations.sh:/workspace/scripts/run_migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  frontend-node-modules:
  postgres-data:
